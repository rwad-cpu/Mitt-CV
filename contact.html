<section class="page-header">
    <div class="container">
        <h1>Kontakt</h1>
        <p>Här kan du skicka ett meddelande till mig.</p>
    </div>
</section>

<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <form id="contactForm" action="https://formspree.io/f/xkoeqbew" method="POST" class="contact-form shadow">
                <div class="mb-3">
                    <label for="name" class="form-label">Namn</label>
                    <input type="text" id="name" name="name" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-post</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="messageText" class="form-label">Meddelande</label>
                    <textarea id="messageText" name="message" class="form-control" rows="5" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Skicka</button>

                <p id="message" class="mt-3"></p>
            </form>

        </div>
    </div>
</section>
